name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
      DATABASE_URL_UNPOOLED: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
      DATABASE_URL_REPLICA: "postgresql://ci_user:ci_pass@localhost:5432/ci_db"
      SHOPIFY_API_KEY: "ci_dummy_key"
      SHOPIFY_API_SECRET: "ci_dummy_secret"
      SCOPES: "read_themes,write_store_credit"
      NODE_ENV: "production"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # --include=dev overrides the NODE_ENV=production default of omitting
        # devDependencies (eslint, vitest) that this job needs for lint/test.
        run: npm ci --legacy-peer-deps --include=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Application (Vite & React Router)
        run: npm run build
