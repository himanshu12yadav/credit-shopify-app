# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e57de15ea2ff48f8d05917790c2eecc2"
name = "Native Store Credit & Rewards"
application_url = "https://credit-shopify-app.onrender.com"
embedded = true
privacy_policy_url = "https://credit-shopify-app.onrender.com/privacy"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products/read_products and write_orders were dropped: no Admin API
# call in this app touches products, and no order mutation is made anywhere
# (orders/paid + refunds/create webhook delivery only needs read_orders).
scopes = "write_customers,read_customers,read_orders,read_store_credit_accounts,write_store_credit_account_transactions,read_store_credit_account_transactions,write_pixels,read_pixels,read_customer_events,read_themes"

[app_proxy]
url = "https://credit-shopify-app.onrender.com"
subpath = "credit"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  # Mandatory GDPR compliance webhooks (required for every Shopify app).
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://credit-shopify-app.onrender.com/api/auth",
  "https://credit-shopify-app.onrender.com/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
